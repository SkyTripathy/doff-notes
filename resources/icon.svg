<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.18" flood-color="#78350f"/>
    </filter>
  </defs>

  <!-- Squircle Note Pad Body with Shadow -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#bgGrad)" stroke="#fcd34d" stroke-width="4" filter="url(#shadow)"/>

  <!-- Top Yellow Binding Bar (Classic Apple Notes) -->
  <path d="M 56 146 C 56 96, 96 56, 146 56 L 366 56 C 416 56, 456 96, 456 146 L 456 156 L 56 156 Z" fill="url(#headerGrad)"/>

  <!-- Perforated Tear Line Under Header -->
  <line x1="66" y1="156" x2="446" y2="156" stroke="#b45309" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Ruled Notebook Lines -->
  <line x1="90" y1="210" x2="422" y2="210" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="264" x2="422" y2="264" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="318" x2="422" y2="318" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="372" x2="422" y2="372" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>

  <!-- Elegant "Doff" Monogram Emboss on Paper -->
  <text x="100" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="800" fill="#f59e0b" opacity="0.22" letter-spacing="4">DOFF</text>

  <!-- Stylish Apple Pencil -->
  <g transform="translate(230, 160) rotate(32)">
    <!-- Pencil Body -->
    <rect x="0" y="0" width="32" height="210" rx="6" fill="url(#pencilBody)"/>
    <!-- Pencil Tip Wood -->
    <polygon points="0,210 32,210 16,252" fill="#fed7aa"/>
    <!-- Pencil Tip Graphite -->
    <polygon points="11,238 21,238 16,252" fill="#1f2937"/>
    <!-- Pencil Eraser Ferrule -->
    <rect x="0" y="-18" width="32" height="18" fill="#9ca3af"/>
    <!-- Pencil Eraser -->
    <rect x="0" y="-32" width="32" height="14" rx="4" fill="#fb7185"/>
  </g>
</svg>
